# Pushing a tag vX.Y.Z[-alpha.N|-beta.N] (see `just release`) builds the
# Docker image, pushes it to this Forgejo instance's container registry and
# calls the Portainer webhook to redeploy.
#
# Image tags: the version (0.1.0-beta.1), the channel (alpha / beta /
# stable) and latest (the newest release of any channel: releases only move
# forward on main).
#
# Secrets: REGISTRY_TOKEN (a Forgejo token with package write access),
# optional REGISTRY_USER (default: the repository owner), PORTAINER_WEBHOOK.
name: release

on:
  push:
    tags: ['v*']

defaults:
  run:
    shell: bash

jobs:
  image:
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-latest
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must be on main
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main ||
            { echo "::error::${{ github.ref_name }} is not on main"; exit 1; }
      # No tests here: `just release` only tags commits whose `ci` workflow passed.
      - name: Names
        run: |
          registry="${{ github.server_url }}"
          registry="${registry#*://}"
          image="$registry/${{ github.repository }}"
          version="${{ github.ref_name }}"
          version="${version#v}"
          case "$version" in
            *-alpha.*) channel=alpha ;;
            *-beta.*) channel=beta ;;
            *) channel=stable ;;
          esac
          {
            echo "REGISTRY=$registry"
            echo "IMAGE=${image,,}"
            echo "VERSION=$version"
            echo "CHANNEL=$channel"
          } >> "$GITHUB_ENV"
      - name: Log in to the registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER || github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          [[ -n $REGISTRY_TOKEN ]] || { echo "::error::REGISTRY_TOKEN secret missing"; exit 1; }
          printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
      - name: Build
        run: |
          docker build --pull --build-arg VERSION="$VERSION" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:$CHANNEL" -t "$IMAGE:latest" .
      - name: Push
        run: |
          for tag in "$VERSION" "$CHANNEL" latest; do
            docker push "$IMAGE:$tag"
          done
      - name: Deploy
        env:
          PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        run: |
          [[ -n $PORTAINER_WEBHOOK ]] || { echo "::warning::PORTAINER_WEBHOOK not set, not deploying"; exit 0; }
          curl -fsS -m 60 -X POST "$PORTAINER_WEBHOOK" >/dev/null
          echo "deploy webhook called"
      - name: Log out
        if: always()
        run: docker logout "$REGISTRY" || true
