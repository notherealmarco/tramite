# Vet, format check and tests on devel and pull requests. main only moves via
# `just release`, which only tags commits that passed here; the release
# workflow just builds.
name: ci

on:
  push:
    branches: [devel]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test -race ./...
